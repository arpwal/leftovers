<!doctype html>
<!-- Link-preview card (1280×640) for GitHub, Hacker News, Reddit and social.
     Rendered by scripts/make-og.sh; edit here, not the PNG. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap">
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{font-family:"Inter",-apple-system,sans-serif;background:linear-gradient(135deg,#f4f4f5 0%,#e4e4e7 100%);display:grid;grid-template-columns:520px 1fr;align-items:center}
.left{padding-left:84px;display:grid;gap:22px}
.left img{width:132px;height:132px;filter:drop-shadow(0 18px 30px rgba(5,150,105,.28))}
h1{margin:0;font-size:64px;letter-spacing:-.03em;color:#18181b}
p{margin:0;font-size:30px;line-height:1.3;color:#3f3f46;font-weight:500}
.tag{font-size:20px;color:#059669;font-weight:700;letter-spacing:.02em}
.right{position:relative;height:640px}
.right img{position:absolute;left:0;top:74px;width:880px}
</style></head>
<body>
  <div class="left">
    <img src="../docs/assets/icon.png" alt="">
    <h1>Leftovers</h1>
    <p>Clean up what your apps and agents left running.</p>
    <span class="tag">FREE · OPEN SOURCE · macOS</span>
  </div>
  <div class="right"><img src="../docs/screenshots/agents-light.png" alt=""></div>
</body></html>
